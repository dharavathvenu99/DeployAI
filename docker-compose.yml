version: '3.8'

services:
  # PostgreSQL Database (Production-like)
  postgres:
    image: postgres:16-alpine
    container_name: deployai-db
    environment:
      POSTGRES_DB: deployai
      POSTGRES_USER: deployai
      POSTGRES_PASSWORD: deployai_secure_pass_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployai -d deployai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployai-backend
    environment:
      - DEMO_MODE=false
      - DATABASE_URL=postgresql://deployai:deployai_secure_pass_2024@postgres:5432/deployai?sslmode=disable
      - FRONTEND_URL=http://localhost:3000,http://localhost:5173
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - NETLIFY_AUTH_TOKEN=${NETLIFY_AUTH_TOKEN:-}
      - VERCEL_TOKEN=${VERCEL_TOKEN:-}
      - RENDER_API_KEY=${RENDER_API_KEY:-}
      - RAILWAY_API_KEY=${RAILWAY_API_KEY:-}
      - PORT=8001
      - PYTHONPATH=/app
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/sample_projects:/app/sample_projects
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Frontend (Production build served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}
    container_name: deployai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: