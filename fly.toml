app = "deployai-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8001"
  DEMO_MODE = "true"
  PYTHONPATH = "/app"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "10s"

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "deployai_uploads"
  destination = "/app/uploads"