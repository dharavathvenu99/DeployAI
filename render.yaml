services:
  - type: web
    name: deployai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: PORT
        value: 8001
      - key: DEMO_MODE
        value: "false"
      - key: FRONTEND_URL
        value: https://deployai-2.onrender.com
      - key: BACKEND_URL
        value: https://deployai-1-zx6q.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: deployai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: NETLIFY_AUTH_TOKEN
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RAILWAY_API_KEY
        sync: false

# Frontend Static Site
# NOTE: if the frontend (https://deployai-2.onrender.com) was created manually,
# set VITE_API_URL=https://deployai-1-zx6q.onrender.com in its Environment
# settings and trigger a manual redeploy. The blueprint below is for fresh setups.
staticSites:
  - name: deployai-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://deployai-1-zx6q.onrender.com

databases:
  - name: deployai-db
    databaseName: deployai
    user: deployai
    plan: free
    region: oregon