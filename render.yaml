services:
  - type: web
    name: deployai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: PORT
        value: 8001
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: deployai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: NETLIFY_AUTH_TOKEN
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RAILWAY_API_KEY
        sync: false

databases:
  - name: deployai-db
    databaseName: deployai
    user: deployai
    plan: free
    region: oregon